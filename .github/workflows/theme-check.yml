name: Theme check

on:
  push:
    branches: [main, pine]
  pull_request:
    branches: [main, pine]

jobs:
  theme-check:
    name: Shopify theme check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli
      - name: Theme check
        run: shopify theme check --fail-level error
